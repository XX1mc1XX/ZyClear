# 持续集成：构建 + 单元测试。
#
# 选 Linux 而非 Windows：Windows runner 上装 OpenCV 需要现场编译（耗时以小时计），
# 而 Ubuntu 一条 apt 就能备齐 Qt 6 与 OpenCV，反馈更快。
#
# 本 job 同时承担第二项职责——验证「外部 SDK 缺失时降级为纯虚拟相机仍可构建」：
# 下面显式把 HikSDK_ROOT 指向不存在的路径，逼 CMake 走降级分支。
# 若哪天有人把海康适配器写成无条件编译，这个 job 会立刻变红。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建与测试（无海康 SDK 降级）
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libopencv-dev

      - name: 配置（刻意不提供海康 SDK）
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHikSDK_ROOT=/nonexistent

      - name: 构建
        run: cmake --build build

      - name: 运行单元测试
        run: ctest --test-dir build --output-on-failure
