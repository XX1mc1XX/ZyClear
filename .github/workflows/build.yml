# CI：构建 + 单元测试。
# 选 Ubuntu 是因为 Qt 与 OpenCV 一条 apt 即可装齐，Windows runner 需现场编译 OpenCV。
# HikSDK_ROOT 故意指向不存在的路径，顺带覆盖缺 SDK 时的降级构建路径。
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: 构建与测试（无海康 SDK 降级）
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            libopencv-dev

      - name: 配置（刻意不提供海康 SDK）
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHikSDK_ROOT=/nonexistent

      - name: 构建
        run: cmake --build build

      - name: 运行单元测试
        run: ctest --test-dir build --output-on-failure
